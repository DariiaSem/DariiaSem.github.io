<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 26: B1-B2 | Volunteering & NGOs</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #fbf6ee;
    --ink: #2b2a33;
    --mute: #6d6a75;
    --card: #fff;
    --coral: #ef6f5e;
    --teal: #1f9d8f;
    --tealsoft: #e3f4f1;
    --gold: #f2b33d;
    --goldsoft: #fdf2d6;
    --plum: #7a4fa3;
    --plumsoft: #f0e6f7;
    --line: #eadfce;
    --ok: #2e9d5b;
    --oksoft: #dcf3e5;
    --bad: #d64545;
    --badsoft: #fbe0e0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; line-height: 1.55; font-size: 16px; scroll-behavior: smooth; }
h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; margin: 0; }

.bar { position: sticky; top: 0; z-index: 20; background: rgba(251,246,238,.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
.bar b { font-family: 'Fraunces', serif; color: var(--coral); }
#nav { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: thin; }
#nav::-webkit-scrollbar { height: 4px; }
#nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
#nav a { flex: none; text-decoration: none; background: #fff; border: 1px solid var(--line); color: var(--ink); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85rem; transition: background 0.2s; }
#nav a:hover { background: var(--gold); }
.score { flex: none; background: var(--ink); color: #fff; border-radius: 20px; padding: 4px 14px; font-weight: 800; }

.hero { max-width: 960px; margin: 28px auto 8px; padding: 0 16px; text-align: center; }
.hero .tag { display: inline-block; background: var(--coral); color: #fff; font-weight: 800; border-radius: 20px; padding: 3px 14px; letter-spacing: .05em; font-size: 0.85rem; margin-bottom: 12px; }
.hero h1 { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; margin: 10px 0; color: var(--ink); }
.hero p { color: var(--mute); margin: 0 auto 14px; font-size: 1.1rem; max-width: 700px; }

main { max-width: 960px; margin: 0 auto; padding: 0 16px 60px; }
.task { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; margin-top: 22px; box-shadow: 0 4px 0 var(--line); scroll-margin-top: 60px; }
.thead { display: flex; gap: 12px; align-items: center; }
.num { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-family: 'Fraunces', serif; font-weight: 800; font-size: 1.2rem; }
.task:nth-of-type(3n+2) .num { background: var(--coral); }
.task:nth-of-type(3n) .num { background: var(--plum); }
.thead h2 { font-size: 1.5rem; }
.instr { color: var(--mute); margin: 8px 0 14px; font-size: 1.05rem; }

/* RICH CARDS */
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 20px; }
.rich-card { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.card-emoji { font-size: 2.2rem; margin-bottom: 10px; display: block; }

/* MINDMAP */
.mindmap { display: flex; flex-direction: column; gap: 16px; align-items: center; margin-bottom: 20px; padding: 20px; background: var(--goldsoft); border-radius: 20px; border: 2px dashed var(--gold); }
.mm-core { background: var(--ink); color: #fff; font-family: 'Fraunces', serif; font-size: 1.8rem; padding: 12px 24px; border-radius: 30px; font-weight: 800; z-index: 2; position: relative; }
.mm-branches { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
.mm-branch { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 16px; }
.mm-branch h4 { color: var(--teal); margin-bottom: 8px; font-family: 'Nunito', sans-serif; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
.mm-branch ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mm-branch li { background: var(--bg); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; border: 1px solid var(--line); }

/* MCQ & BUTTONS */
.q { border-top: 1px dashed var(--line); padding: 12px 0; }
.qt { font-weight: 700; margin-bottom: 8px; font-size: 1.05rem; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
button { font-family: inherit; }
.opt, .btn { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 7px 14px; cursor: pointer; font-weight: 700; font-size: .95rem; color: var(--ink); transition: border 0.2s; }
.opt:hover, .btn:hover { border-color: var(--teal); }
.btn { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn.alt { background: #fff; color: var(--ink); border-color: var(--line); }
.good { background: var(--oksoft) !important; border-color: var(--ok) !important; color: #1E6038 !important; }
.bad { background: var(--badsoft) !important; border-color: var(--bad) !important; color: #7F1D1D !important; }
.fb { color: var(--ok); font-size: .9rem; margin-left: 8px; font-weight: 700; }

/* VOCAB FLIP CARDS */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.vcard { position: relative; height: 180px; cursor: pointer; }
.vocab-front, .vocab-def { position: absolute; inset: 0; border-radius: 16px; padding: 14px; transition: opacity .25s; display: flex; flex-direction: column; justify-content: center; border: 2px solid var(--line); }
.vocab-front { background: #fff; opacity: 1; align-items: center; text-align: center; gap: 4px; }
.vocab-def { background: var(--tealsoft); opacity: 0; font-size: .9rem; overflow: auto; align-items: center; text-align: center; gap: 4px; border-color: var(--teal); font-weight: 600; }
.vcard:hover .vocab-front, .vcard.flip .vocab-front { opacity: 0; }
.vcard:hover .vocab-def, .vcard.flip .vocab-def { opacity: 1; }
.en { font-family: 'Fraunces', serif; font-weight: 800; font-size: 1.45rem; color: var(--coral); }
.say { background: none; border: none; cursor: pointer; font-size: 1.2rem; }

/* PRONUNCIATION */
.pron { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-top: 1px dashed var(--line); padding: 12px 0; }
.pron .w { font-family: 'Fraunces', serif; font-weight: 800; font-size: 1.25rem; min-width: 130px; }
.pron .ipa { color: var(--mute); min-width: 120px; font-family: monospace; }
.syl { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 4px 12px; cursor: pointer; font-weight: 700; }

/* GAP FILL & TOOLKIT */
.note { background: var(--goldsoft); border-radius: 12px; padding: 12px 16px; margin: 10px 0; font-size: .95rem; }
.gap { padding: 8px 0; border-top: 1px dashed var(--line); display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 1.05rem; }
select, input[type=text], textarea { font-family: inherit; font-size: 1rem; border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; background: #fff; outline: none; }
select:focus, input[type=text]:focus, textarea:focus { border-color: var(--teal); }

/* MATCH IT */
.match { display: grid; grid-template-columns: 1fr 1.2fr; gap: 14px; }
.mcol { display: flex; flex-direction: column; gap: 8px; }
.mitem { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: left; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
.mitem.sel { border-color: var(--gold); background: var(--goldsoft); }

/* ERROR SPY */
.spyrow { padding: 14px 0; border-top: 1px dashed var(--line); font-size: 1.05rem; }
.spy { background: var(--goldsoft); border-radius: 6px; padding: 1px 6px; cursor: pointer; font-weight: 700; border: 1px solid var(--gold); }
.spy.wrong { background: var(--badsoft); border-color: var(--bad); }
.spy.found { background: var(--oksoft); border-color: var(--ok); color: #1E6038; }

/* ORDERER */
.order { padding-left: 0; list-style: none; margin: 10px 0; }
.oitem { display: flex; gap: 8px; align-items: center; padding: 6px 10px; margin: 4px 0; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-weight: 600; font-size: 1.05rem; }
.oitem span { flex: 1; }
.mini { background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; padding: 2px 8px; font-size: 1.1rem; font-weight: 800; }

/* CHAT */
.chat-container { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.chat-msg { max-width: 85%; padding: 10px 16px; border-radius: 16px; font-size: 1rem; font-weight: 600; position: relative; }
.chat-msg.received { background: var(--bg); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--line); }
.chat-msg.sent { background: var(--teal); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.chat-name { font-size: 0.75rem; font-weight: 800; margin-bottom: 2px; color: var(--mute); }
.chat-msg.sent .chat-name { text-align: right; color: var(--tealsoft); }

/* TRANSLATION TABLE */
table { border-collapse: collapse; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
th, td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; }
th { background: var(--tealsoft); color: var(--teal); font-weight: 800; }
td { background: #fff; font-weight: 600; }
td.en { font-family: 'Fraunces', serif; font-size: 1.1rem; color: var(--coral); }
td.def { color: var(--mute); }
.hide-en td.en:not(.peek), .hide-def td.def:not(.peek), .hide-ua td.ua:not(.peek) { filter: blur(6px); cursor: pointer; background: var(--line); color: transparent; }

/* SPINBOX & WRITING */
.spinbox { background: var(--goldsoft); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 14px; border: 2px dashed var(--gold); }
.big { font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 800; color: var(--coral); margin-bottom: 12px; line-height: 1.2; }
textarea { width: 100%; min-height: 120px; resize: vertical; margin-bottom: 8px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.words span { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 2px 10px; font-size: .85rem; font-weight: 700; color: var(--mute); }
.words span.on { background: var(--oksoft); color: #1E6038; border-color: var(--ok); }

/* UA HOVER */
.ua-hover { position: relative; cursor: help; border-bottom: 2px dotted var(--teal); font-weight: 700; color: var(--teal); transition: all 0.2s; }
.ua-hover:hover { background: var(--tealsoft); }
.ua-hover .ua-tooltip { content: attr(data-ua); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; font-family: 'Nunito', sans-serif; white-space: nowrap; opacity: 0; visibility: hidden; transition: all 0.2s; font-weight: 600; pointer-events: none; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.ua-hover .ua-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 6px; border-style: solid; border-color: var(--ink) transparent transparent transparent; }
.ua-hover:hover .ua-tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

footer { text-align: center; color: var(--mute); padding: 30px 16px; font-weight: 700; font-size: 0.9rem; }
@media(max-width: 600px) { .match { grid-template-columns: 1fr; } .mm-branches { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar"><b>L26</b><div id="nav"></div><div class="score">⭐ <span id="score">0 / 0</span></div></div>

<div class="hero">
  <span class="tag">LESSON 26</span>
  <h1>Helping the Homeless</h1>
  <p>Explore B1/B2 vocabulary for charities, master <i>Both, Either, Neither</i>, and plan civic action using the Future Continuous tense.</p>
</div>

<main id="tasks"></main>
<footer>Lesson 26 · Volunteering & NGOs · Keep your stars — try to beat your score next time ⭐</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (t, c, html) => { const e = document.createElement(t); if(c) e.className = c; if(html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\b(the|a|an)\b/g, '').replace(/\s+/g, ' ').trim();

let total = 0; const done = new Set();
const upd = () => { $('#score').textContent = done.size + ' / ' + total; };
const reg = (n = 1) => { total += n; upd(); };
const ok = k => { if(!done.has(k)) { done.add(k); upd(); } };
function say(t, l='en-GB') { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = l; u.rate = 0.85; speechSynthesis.speak(u); } catch(e) {} }

const main = $('#tasks');
function task(n, icon, title, instr) {
  const s = h('section', 'task'); s.id = 't' + n;
  s.innerHTML = `<div class="thead"><span class="num">${icon}</span><h2>${title}</h2></div><p class="instr">${instr}</p>`;
  const b = h('div'); s.appendChild(b); main.appendChild(s);
  const a = h('a', null, n); a.href = '#t' + n; $('#nav').appendChild(a);
  return b;
}

/* MCQ Function */
function mcq(box, items, key) {
  items.forEach((it, i) => {
    reg();
    const q = h('div', 'q'); q.innerHTML = `<div class="qt">${it.q}</div>`;
    const o = h('div', 'opts'), fb = h('div', 'fb'); let wrong = false, solved = false;
    let ops = it.o.map((t, j) => ({ t, c: j === (it.a || 0) })); 
    if(!it.fixed) ops = shuffle(ops);
    ops.forEach(op => {
      const b = h('button', 'opt', op.t);
      b.onclick = () => {
        if(solved) return;
        if(op.c) { solved = true; b.classList.add('good'); if(!wrong) ok(key + i); if(it.w) fb.textContent = it.w; }
        else { wrong = true; b.classList.add('bad'); b.disabled = true; }
      };
      o.appendChild(b);
    });
    q.append(o, fb); box.appendChild(q);
  });
}
const tf = (box, items, key) => mcq(box, items.map(x => ({ q: x[0], o: ['True', 'False'], a: x[1] ? 0 : 1, fixed: true, w: x[2] })), key);

/* Flip Cards Function */
function flip(front, def) {
  const c = h('div', 'vcard');
  c.innerHTML = `<div class="vocab-front">${front}</div><div class="vocab-def">${def}</div>`;
  c.onclick = () => c.classList.toggle('flip');
  return c;
}

/* ---------------- 1 WARM-UP ---------------- */
(() => {
  const b = task(1, '🔥', 'Warm-up & Discussion', 'Discuss these civic questions with your teacher.');
  
  const g = h('div', 'card-grid');
  g.innerHTML = `
    <div class="rich-card" style="border-top: 4px solid var(--teal)">
      <span class="card-emoji">🤝</span>
      <h4 style="margin-top:0">Civic Duty</h4>
      <p style="margin:0; color:var(--mute)">Have you ever volunteered for a grassroots initiative? What motivates people to give their free time?</p>
    </div>
    <div class="rich-card" style="border-top: 4px solid var(--coral)">
      <span class="card-emoji">🏙️</span>
      <h4 style="margin-top:0">The Housing Crisis</h4>
      <p style="margin:0; color:var(--mute)">What are the primary factors that push marginalized communities into homelessness in modern cities?</p>
    </div>
  `;
  b.appendChild(g);

  mcq(b, [
    { q: 'What does <b>NGO</b> stand for?', o: ['Non-Governmental Organization', 'National Group Operation', 'New Global Order'] },
    { q: 'If an organization is "non-profit", it means...', o: ['all money made goes back into the cause.', 'nobody working there gets a salary.', 'they do not accept cash donations.'] }
  ], 'q1_');
})();

/* ---------------- 2 VOCAB MINDMAP ---------------- */
(() => {
  const b = task(2, '🧠', 'Vocabulary Mindmap', 'Discover the advanced vocabulary of the non-profit sector.');
  
  const mm = h('div', 'mindmap');
  mm.innerHTML = `
    <div class="mm-core">Volunteering & Society (B2)</div>
    <div class="mm-branches">
      <div class="mm-branch" style="border-color: var(--teal)">
        <h4>The People</h4>
        <ul>
          <li><b>Marginalized:</b> Pushed to the edges of society; ignored.</li>
          <li><b>Destitute:</b> Extremely poor; lacking basic necessities like food/shelter.</li>
        </ul>
      </div>
      <div class="mm-branch" style="border-color: var(--coral)">
        <h4>The Actions</h4>
        <ul>
          <li><b>To Mobilize:</b> To organize people and resources for a purpose.</li>
          <li><b>Advocacy:</b> Public support for a cause or policy.</li>
        </ul>
      </div>
      <div class="mm-branch" style="border-color: var(--plum)">
        <h4>The Organizations</h4>
        <ul>
          <li><b>Grassroots:</b> Movements driven by ordinary local people, not politicians.</li>
          <li><b>Initiative:</b> A new plan or process to solve a problem.</li>
        </ul>
      </div>
      <div class="mm-branch" style="border-color: var(--gold)">
        <h4>The Concepts</h4>
        <ul>
          <li><b>Philanthropy:</b> The act of donating money/time to promote human welfare.</li>
          <li><b>Altruism:</b> Selfless concern for the well-being of others.</li>
        </ul>
      </div>
    </div>
  `;
  b.appendChild(mm);
})();

/* ---------------- 3 SAY IT RIGHT ---------------- */
(() => {
  const b = task(3, '🗣️', 'Say It Right', 'Press 🔊, listen, then click the <b>stressed syllable</b> of these complex B2 words.');
  const P = [
    ['marginalized', '/ˈmɑːdʒɪnəlaɪzd/', ['mar', 'gi', 'nal', 'ized'], 0, 'Stress on MAR.'],
    ['philanthropy', '/fɪˈlænθrəpi/', ['phi', 'lan', 'thro', 'py'], 1, 'Stress on LAN.'],
    ['initiative', '/ɪˈnɪʃətɪv/', ['in', 'i', 'tia', 'tive'], 1, 'Stress on I (ni).'],
    ['altruism', '/ˈæltruɪzəm/', ['al', 'tru', 'ism'], 0, 'Stress on AL.'],
    ['advocacy', '/ˈædvəkəsi/', ['ad', 'vo', 'ca', 'cy'], 0, 'Stress on AD.']
  ];
  
  P.forEach((p, k) => {
    reg(); const r = h('div', 'pron');
    r.innerHTML = `<span class="w">${p[0]}</span><span class="ipa">${p[1]}</span>`;
    const s = h('button', 'say', '🔊'); s.onclick = () => say(p[0]); r.appendChild(s);
    const fb = h('span', 'fb'); let wrong = false, solved = false;
    p[2].forEach((t, i) => {
      const y = h('button', 'syl', t);
      y.onclick = () => {
        if(solved) return;
        if(i === p[3]) { solved = true; y.classList.add('good'); y.textContent = t.toUpperCase(); if(!wrong) ok('p'+k); fb.textContent = p[4]; }
        else { wrong = true; y.classList.add('bad'); }
      };
      r.appendChild(y);
    });
    r.appendChild(fb); b.appendChild(r);
  });
})();

/* ---------------- 4 VOCAB FLIP CARDS ---------------- */
(() => {
  const b = task(4, '🎴', 'Concept Check', 'Tap to flip and review definitions. Say them aloud.');
  
  const V = [
    ['Destitute', 'Without the basic necessities of life; completely impoverished.'],
    ['Grassroots', 'Originating from the ordinary people in a community, not leadership.'],
    ['Mobilize', 'To prepare and organize troops or people for active service or a specific cause.'],
    ['Philanthropy', 'The desire to promote the welfare of others, usually expressed by generous donations.']
  ];
  
  const g = h('div', 'cards');
  V.forEach(v => {
    const f = `<div class="en">${v[0]}</div><button class="say" title="Listen">🔊</button><small style="color:var(--mute); margin-top:6px;">tap to flip</small>`;
    const d = `<div>${v[1]}</div>`;
    const c = flip(f, d);
    c.querySelector('.say').onclick = e => { e.stopPropagation(); say(v[0]); };
    g.appendChild(c);
  });
  b.appendChild(g);
})();

/* ---------------- 5 MATCH IT ---------------- */
(() => {
  const b = task(5, '🧩', 'Match the Context', 'Click the vocabulary word on the left, then its correct context on the right.');
  
  const pairs = [
    ['Marginalized', '...groups often lack access to quality healthcare and education.'],
    ['Advocacy', '...groups protest at city hall to change housing laws.'],
    ['Altruism', 'Her ... inspired her to dedicate her weekends to the soup kitchen.'],
    ['Initiative', 'The new government ... aims to build 500 affordable homes.'],
    ['Mobilize', 'We need to ... hundreds of volunteers for the winter drive.']
  ];
  
  reg(pairs.length);
  const w = h('div', 'match'), L = h('div', 'mcol'), R = h('div', 'mcol'); let sl = null, sr = null;
  const mk = (txt, id, side) => {
    const btn = h('button', 'mitem', txt); btn.dataset.id = id;
    btn.onclick = () => {
      if(btn.classList.contains('good')) return;
      if(side === 'L') { if(sl) sl.classList.remove('sel'); sl = btn; } else { if(sr) sr.classList.remove('sel'); sr = btn; }
      btn.classList.add('sel');
      if(sl && sr) {
        const a = sl, c = sr; sl = sr = null;
        if(a.dataset.id === c.dataset.id) { [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); }); ok('m' + a.dataset.id); }
        else { [a, c].forEach(x => x.classList.add('bad')); setTimeout(() => [a, c].forEach(x => x.classList.remove('bad', 'sel')), 600); }
      }
    }; return btn;
  };
  shuffle(pairs.map((p, i) => [p[0], i])).forEach(x => L.appendChild(mk(x[0], x[1], 'L')));
  shuffle(pairs.map((p, i) => [p[1], i])).forEach(x => R.appendChild(mk(x[0], x[1], 'R')));
  w.append(L, R); b.appendChild(w);
})();

/* ---------------- 11 ORDERER ---------------- */
(() => {
  const b = task(11, '🧩', 'Sentence Builder', 'Arrange the words to form a correct Future Continuous sentence.');
  
  const seq = ['This', 'time', 'next', 'Friday,', 'we', 'will', 'be', 'raising', 'funds', 'downtown.'];
  reg(1); let cur = shuffle(seq); while(cur.join() === seq.join()) cur = shuffle(seq);
  const list = h('ol', 'order');
  const draw = () => {
    list.innerHTML = '';
    cur.forEach((t, i) => {
      const li = h('li', 'oitem'); li.innerHTML = `<span>${t}</span>`;
      const u = h('button', 'mini', '↑'), d = h('button', 'mini', '↓');
      u.onclick = () => { if(i > 0) { [cur[i-1], cur[i]] = [cur[i], cur[i-1]]; draw(); } };
      d.onclick = () => { if(i < cur.length - 1) { [cur[i+1], cur[i]] = [cur[i], cur[i+1]]; draw(); } };
      li.append(u, d); list.appendChild(li);
    });
  };
  draw();
  const btn = h('button', 'btn', 'Check syntax'), fb = h('span', 'fb'); 
  btn.onclick = () => {
    let all = true;
    [...list.children].forEach((li, i) => {
      const g = cur[i] === seq[i];
      li.classList.toggle('good', g); li.classList.toggle('bad', !g);
      if(!g) all = false;
    });
    fb.textContent = all ? ' ✔ Perfect syntax!' : ' Green = right place.';
    if(all) ok('ord1');
  };
  b.append(list, btn, fb);
})();

/* ---------------- 12 ERROR SPY ---------------- */
(() => {
  const b = task(12, '🔍', 'Error Spy', 'Each sentence hides ONE grammatical mistake. Click the wrong word, then type the correction.');
  
  const E = [
    ['[Both] of the philanthropic initiatives [is] severely underfunded.', 1, ['are']],
    ['We will [mobilizing] volunteers at the shelter [at] 6 PM [tomorrow].', 0, ['be mobilizing', 'mobilize']],
    ['I cannot attend the advocacy meeting on [Monday], nor [Tuesday]. I can\'t attend [both] day.', 2, ['either']],
    ['[Neither] of the two grassroots leaders [have] enough resources for the [winter].', 1, ['has']],
    ['They will [be] conduct the fundraiser [during] the [weekend].', 1, ['conducting']]
  ];
  
  E.forEach((e, k) => {
    reg(); const d = h('div', 'spyrow'); let idx = 0;
    const html = e[0].replace(/\[(.+?)\]/g, (m, w) => `<span class="spy" data-i="${idx++}">${w}</span>`);
    d.innerHTML = `<div>${html}</div>`; 
    const fix = h('div', 'fix-box'); d.appendChild(fix);
    d.querySelectorAll('.spy').forEach(sp => {
      sp.onclick = () => {
        if(sp.classList.contains('found')) return;
        if(+sp.dataset.i !== e[1]) { sp.classList.add('wrong'); setTimeout(() => sp.classList.remove('wrong'), 600); return; }
        sp.classList.add('wrong');
        fix.innerHTML = ''; 
        const inp = h('input'); inp.type = 'text'; inp.placeholder = 'Type correction...';
        const c = h('button', 'btn', 'Fix');
        c.onclick = () => {
          if(e[2].map(norm).includes(norm(inp.value))) {
            sp.classList.remove('wrong'); sp.classList.add('found'); sp.textContent = e[2][0];
            fix.innerHTML = '<span class="fb">✔ Fixed!</span>'; ok('e'+k);
          } else { inp.className = 'bad'; }
        };
        inp.onkeydown = ev => { if(ev.key === 'Enter') c.click(); };
        fix.append(inp, c); inp.focus();
      };
    });
    b.appendChild(d);
  });
})();

(() => {

  const CH = [

  const spin = h('button', 'btn', '🎰 SPIN'), tm = h('button', 'btn alt', '⏱ Start 60 s'); tm.style.marginLeft = '8px';
  let iv = null;
  spin.onclick = () => { 
    const c = shuffle(CH)[0]; 
    $('#spOrg').style.fontSize = '1.6rem'; 
    $('#spOrg').style.fontFamily = 'var(--font-ui)';
    $('#spOrg').style.fontWeight = '700';
    $('#spOrg').style.color = 'var(--ink)';
    $('#spOrg').textContent = c; 
    $('#spT').textContent = ''; clearInterval(iv); 
  };
  tm.onclick = () => { 
    clearInterval(iv); let t = 60; $('#spT').textContent = t + 's'; 
    iv = setInterval(() => { t--; $('#spT').textContent = t > 0 ? t + 's' : 'Time! 👏'; if(t <= 0) clearInterval(iv); }, 1000); 
  };
  sb.append(spin, tm); b.appendChild(sb);
  
  b.appendChild(h('h3', null, '✍️ Writing log')); b.lastChild.style.margin = '20px 0 8px';
  b.appendChild(h('p', 'instr', 'Write 5–7 sentences answering your prompt. Try to use at least <b>3</b> words from the vocabulary list.'));
  
  const W = ['philanthropy', 'altruism', 'marginalized', 'grassroots', 'initiative', 'advocacy', 'mobilize', 'destitute', 'both', 'either', 'neither'];
  const ta = h('textarea'); ta.placeholder = 'In my opinion, addressing the needs of marginalized communities requires both...';
  
  const wd = h('div', 'words'); wd.innerHTML = W.map(w => `<span>${w}</span>`).join('');
  const cnt = h('div', 'fb'); cnt.style.color = 'var(--mute)'; reg();
  
  const upd2 = () => {
    const t = ta.value.toLowerCase(); let n = 0;
    [...wd.children].forEach((s, i) => { const on = t.includes(W[i]); s.classList.toggle('on', on); if(on) n++; });
    const wc = (ta.value.trim().match(/\S+/g) || []).length; 
    cnt.textContent = `${wc} words · ${n} target words used`;
    if(n >= 3 && wc >= 30) ok('write');
  };
  ta.oninput = upd2; b.append(ta, wd, cnt); upd2();
})();
