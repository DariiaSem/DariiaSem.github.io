<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 26: B1 | Volunteering & NGOs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    /* Hybrid Theme: Combining the warmth of the new template with the sleekness of the old */
    --bg: #F4F7F6; 
    --ink: #1E293B; 
    --mute: #64748B; 
    --card: #FFFFFF; 
    --coral: #F43F5E; 
    --teal: #0EA5E9; 
    --tealsoft: #E0F2FE; 
    --gold: #F59E0B; 
    --goldsoft: #FEF3C7; 
    --plum: #8B5CF6; 
    --line: #E2E8F0; 
    --ok: #10B981; 
    --oksoft: #D1FAE5; 
    --bad: #EF4444; 
    --badsoft: #FEE2E2;

    --font-ui: 'Plus Jakarta Sans', sans-serif;
    --font-serif: 'Instrument Serif', serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); line-height: 1.6; font-size: 16px; scroll-behavior: smooth; }
h1, h2, h3, h4 { font-family: var(--font-serif); margin: 0; }

/* NAV BAR */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(244, 247, 246, 0.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 16px; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
.bar b { font-family: var(--font-ui); color: var(--teal); font-weight: 800; font-size: 1.1rem; }
#nav { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#nav a { flex: none; text-decoration: none; background: #fff; border: 1px solid var(--line); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .9rem; transition: all 0.2s; }
#nav a:hover, #nav a.active { background: var(--teal); color: #fff; border-color: var(--teal); transform: translateY(-2px); }
.score { flex: none; background: var(--ink); color: #fff; border-radius: 20px; padding: 6px 16px; font-weight: 800; }

/* HERO */
.hero { max-width: 960px; margin: 40px auto 20px; padding: 0 24px; text-align: center; }
.hero .tag { display: inline-block; background: var(--teal); color: #fff; font-weight: 800; border-radius: 20px; padding: 6px 16px; letter-spacing: 1px; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 16px; }
.hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); line-height: 1.1; margin: 0 0 16px; font-weight: 800; }
.hero p { color: var(--mute); margin: 0 auto 24px; font-size: 1.2rem; max-width: 700px; }

/* MAIN & TASKS */
main { max-width: 960px; margin: 0 auto; padding: 0 24px 80px; }
.task { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 32px; margin-top: 32px; box-shadow: 0 8px 30px rgba(0,0,0,0.03); scroll-margin-top: 80px; }
.thead { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
.num { flex: none; width: 48px; height: 48px; border-radius: 16px; background: var(--teal); color: #fff; display: grid; place-items: center; font-family: var(--font-serif); font-weight: 800; font-size: 1.6rem; }
.task:nth-of-type(3n+2) .num { background: var(--coral); }
.task:nth-of-type(3n) .num { background: var(--plum); }
.thead h2 { font-size: 2rem; font-weight: 800; }
.instr { color: var(--mute); margin: 0 0 24px; font-size: 1.1rem; }

/* RICH CARDS & DISCUSSION */
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 24px; }
.rich-card { background: var(--bg); border-radius: 16px; padding: 24px; border: 1px solid var(--line); }
.card-emoji { font-size: 2.5rem; margin-bottom: 12px; display: block; }
.rich-card h4 { font-family: var(--font-ui); font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
.rich-card p { font-size: 0.95rem; color: var(--mute); margin: 0; }

/* MCQ & BUTTONS */
.q { border-top: 1px dashed var(--line); padding: 16px 0; }
.qt { font-weight: 700; margin-bottom: 12px; font-size: 1.1rem; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
button { font-family: inherit; }
.opt, .btn, .mini { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: all 0.2s; color: var(--ink); }
.opt:hover, .btn:hover { border-color: var(--teal); color: var(--teal); }
.btn { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn:hover { background: #0284C7; color: #fff; border-color: #0284C7; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2); }
.btn.alt { background: #fff; color: var(--ink); border-color: var(--line); }
.good { background: var(--oksoft) !important; border-color: var(--ok) !important; color: #065F46 !important; }
.bad { background: var(--badsoft) !important; border-color: var(--bad) !important; color: #991B1B !important; }
.fb { color: var(--ok); font-size: 1rem; margin-top: 8px; font-weight: 700; display: inline-block; }

/* FLIP CARDS */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.vcard { position: relative; height: 200px; cursor: pointer; perspective: 1000px; }
.vocab-front, .vocab-def { position: absolute; inset: 0; border-radius: 16px; padding: 20px; transition: transform 0.5s, opacity 0.5s; display: flex; flex-direction: column; justify-content: center; border: 2px solid var(--line); backface-visibility: hidden; }
.vocab-front { background: #fff; text-align: center; gap: 8px; }
.vocab-def { background: var(--tealsoft); font-size: 0.95rem; border-color: var(--teal); transform: rotateY(180deg); text-align: center; }
.vcard.flip .vocab-front { transform: rotateY(180deg); }
.vcard.flip .vocab-def { transform: rotateY(0deg); }
.en { font-family: var(--font-serif); font-weight: 800; font-size: 2rem; color: var(--teal); line-height: 1.1; }
.la { color: var(--mute); font-weight: 600; font-size: 1rem; }

/* PRONUNCIATION */
.say { background: var(--goldsoft); border: none; cursor: pointer; font-size: 1.2rem; border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; transition: transform 0.2s; }
.say:hover { transform: scale(1.1); background: var(--gold); }
.pron { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-top: 1px dashed var(--line); padding: 16px 0; }
.pron .w { font-family: var(--font-serif); font-weight: 800; font-size: 1.5rem; min-width: 150px; }
.pron .ipa { color: var(--mute); min-width: 140px; font-family: monospace; font-size: 1.1rem; }
.syl { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 6px 14px; cursor: pointer; font-weight: 700; font-size: 1.1rem; }

/* GAP FILL & GRAMMAR BOXES */
.grammar-box { background: var(--bg); border: 1px solid var(--line); border-left: 6px solid var(--teal); padding: 24px; border-radius: 16px; margin-bottom: 24px; }
.grammar-box h3 { font-family: var(--font-ui); font-size: 1.2rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.gap { padding: 12px 0; border-top: 1px dashed var(--line); font-size: 1.1rem; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
select, input[type=text], textarea { font-family: inherit; font-size: 1rem; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; background: #fff; outline: none; font-weight: 600; color: var(--ink); }
select:focus, input[type=text]:focus, textarea:focus { border-color: var(--teal); }

/* MATCH IT */
.match { display: grid; grid-template-columns: 1fr 1.5fr; gap: 16px; }
.mcol { display: flex; flex-direction: column; gap: 10px; }
.mitem { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; text-align: left; cursor: pointer; font-weight: 600; font-size: 1rem; line-height: 1.4; transition: all 0.2s; }
.mitem:hover { border-color: var(--gold); }
.mitem.sel { border-color: var(--gold); background: var(--goldsoft); transform: scale(1.02); }

/* ERROR SPY */
.spyrow { padding: 16px 0; border-top: 1px dashed var(--line); font-size: 1.1rem; }
.spy { background: var(--goldsoft); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-weight: 700; transition: background 0.2s; display: inline-block; margin: 0 4px; border: 1px solid #FCD34D; }
.spy:hover { background: var(--gold); }
.spy.wrong { background: var(--badsoft); border-color: var(--bad); }
.spy.found { background: var(--oksoft); border-color: var(--ok); color: #065F46; }
.fix-box { margin-top: 12px; display: flex; gap: 10px; align-items: center; }

/* ORDERER */
.order { padding-left: 0; list-style: none; margin: 0 0 16px; }
.oitem { display: flex; gap: 10px; align-items: center; padding: 10px 16px; margin: 8px 0; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-weight: 600; font-size: 1.1rem; }
.oitem span { flex: 1; }
.mini { padding: 4px 12px; font-size: 1.2rem; }

/* CHAT ROLEPLAY */
.chat-container { background: var(--bg); border-radius: 20px; padding: 24px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
.chat-msg { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 1.05rem; font-weight: 500; position: relative; line-height: 1.5; }
.chat-msg.received { background: #fff; color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--line); }
.chat-msg.sent { background: var(--teal); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.chat-name { font-size: 0.8rem; font-weight: 800; margin-bottom: 4px; color: var(--mute); }
.chat-msg.sent .chat-name { text-align: right; color: var(--tealsoft); }

/* TRANSLATION TABLE */
table { border-collapse: collapse; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 16px; }
th, td { border-bottom: 1px solid var(--line); padding: 12px 16px; text-align: left; }
th { background: var(--tealsoft); font-weight: 800; color: var(--teal); }
td { background: #fff; font-weight: 600; }
.hide-en td.en:not(.peek), .hide-la td.la:not(.peek), .hide-ua td.ua:not(.peek) { filter: blur(7px); cursor: pointer; background: var(--line); color: transparent; }
td.en { font-family: var(--font-serif); font-size: 1.2rem; color: var(--coral); }
td.la { color: var(--mute); }

/* SPINBOX */
.spinbox { background: var(--goldsoft); border-radius: 24px; padding: 32px; text-align: center; margin-bottom: 24px; border: 2px dashed #FCD34D; }
.big { font-family: var(--font-serif); font-size: 2.5rem; font-weight: 800; color: var(--coral); margin-bottom: 16px; line-height: 1.2; }
.words { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.words span { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; font-size: 0.9rem; font-weight: 700; color: var(--mute); transition: all 0.3s; }
.words span.on { background: var(--oksoft); color: #065F46; border-color: var(--ok); }
textarea { width: 100%; min-height: 120px; resize: vertical; }

/* HOVER TRANSLATION (UA) */
.ua-hover { position: relative; cursor: help; border-bottom: 2px dotted var(--teal); font-weight: 700; color: var(--teal); transition: all 0.2s; }
.ua-hover:hover { background: var(--tealsoft); }
.ua-hover .ua-tooltip { content: attr(data-ua); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; font-family: var(--font-ui); white-space: nowrap; opacity: 0; visibility: hidden; transition: all 0.2s; font-weight: 600; pointer-events: none; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.ua-hover .ua-tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 6px; border-style: solid; border-color: var(--ink) transparent transparent transparent; }
.ua-hover:hover .ua-tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

footer { text-align: center; color: var(--mute); padding: 40px 24px; font-weight: 600; font-size: 0.9rem; }
@media(max-width:600px) { .match { grid-template-columns: 1fr; } .opts { flex-direction: column; } .opt { width: 100%; text-align: center; } }
</style>
</head>
<body>
<div class="bar"><b>L26</b><div id="nav"></div><div class="score">⭐ <span id="score">0 / 0</span></div></div>

<div class="hero">
  <span class="tag">LESSON 26</span>
  <h1>Helping the Homeless</h1>
  <p>Learn vocabulary for charities and NGOs, master <i>Both/Either/Neither</i>, and talk about ongoing actions with the Future Continuous.</p>
</div>

<main id="tasks"></main>
<footer>Lesson 26 · Volunteering & NGOs · Collect your stars and practice your English! ⭐</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (t, c, html) => { const e = document.createElement(t); if(c) e.className = c; if(html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\b(the|a|an)\b/g, '').replace(/\s+/g, ' ').trim();

let total = 0; const done = new Set();
const upd = () => { $('#score').textContent = done.size + ' / ' + total; };
const reg = (n = 1) => { total += n; upd(); };
const ok = k => { if(!done.has(k)) { done.add(k); upd(); } };
function say(t, l='en-GB') { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = l; u.rate = 0.9; speechSynthesis.speak(u); } catch(e) {} }

const main = $('#tasks');
function task(n, icon, title, instr) {
  const s = h('section', 'task'); s.id = 't' + n;
  s.innerHTML = `<div class="thead"><span class="num">${icon}</span><h2>${title}</h2></div><p class="instr">${instr}</p>`;
  const b = h('div'); s.appendChild(b); main.appendChild(s);
  const a = h('a', null, n); a.href = '#t' + n; $('#nav').appendChild(a);
  return b;
}

/* MCQ Function */
function mcq(box, items, key) {
  items.forEach((it, i) => {
    reg();
    const q = h('div', 'q'); q.innerHTML = `<div class="qt">${it.q}</div>`;
    const o = h('div', 'opts'), fb = h('div', 'fb'); let wrong = false, solved = false;
    let ops = it.o.map((t, j) => ({ t, c: j === (it.a || 0) })); 
    if(!it.fixed) ops = shuffle(ops);
    ops.forEach(op => {
      const b = h('button', 'opt', op.t);
      b.onclick = () => {
        if(solved) return;
        if(op.c) { solved = true; b.classList.add('good'); if(!wrong) ok(key + i); if(it.w) fb.textContent = it.w; }
        else { wrong = true; b.classList.add('bad'); b.disabled = true; }
      };
      o.appendChild(b);
    });
    q.append(o, fb); box.appendChild(q);
  });
}
const tf = (box, items, key) => mcq(box, items.map(x => ({ q: x[0], o: ['True', 'False'], a: x[1] ? 0 : 1, fixed: true, w: x[2] })), key);

/* Flip Cards Function */
function flip(front, def) {
  const c = h('div', 'vcard');
  c.innerHTML = `<div class="vocab-front">${front}</div><div class="vocab-def">${def}</div>`;
  c.onclick = () => c.classList.toggle('flip');
  return c;
}

/* ---------------- 1 WARM-UP ---------------- */
(() => {
  const b = task(1, '🔥', 'Warm-up & Discussion', 'Discuss these questions, then test your basic knowledge.');
  
  const g = h('div', 'card-grid');
  g.innerHTML = `
    <div class="rich-card" style="border-top: 4px solid var(--teal)">
      <span class="card-emoji">🤝</span>
      <h4>Have you ever?</h4>
      <p>Have you ever volunteered your time or donated to a charity? What was the cause?</p>
    </div>
    <div class="rich-card" style="border-top: 4px solid var(--coral)">
      <span class="card-emoji">🏙️</span>
      <h4>City Problems</h4>
      <p>What do you think are the main reasons people become homeless in modern cities?</p>
    </div>
    <div class="rich-card" style="border-top: 4px solid var(--plum)">
      <span class="card-emoji">🏢</span>
      <h4>Who is responsible?</h4>
      <p>Do you think it's the government's job to solve homelessness, or should NGOs take the lead?</p>
    </div>
  `;
  b.appendChild(g);

  mcq(b, [
    { q: 'What does <b>NGO</b> stand for?', o: ['Non-Governmental Organization', 'National Group Operation', 'New Global Order'] },
    { q: 'If you work for free to help others, you are a...', o: ['volunteer', 'donator', 'charity worker', 'fundraiser'] }
  ], 'q1_');
})();

/* ---------------- 2 VOCABULARY (FLIP) ---------------- */
(() => {
  const b = task(2, '📖', 'NGO Vocabulary', 'Tap each card to flip it and read the definition.');
  
  const V = [
    ['Charity', 'charity', 'An organization set up to provide help and raise money for those in need.'],
    ['Donate', 'donate', 'To give money, goods, or time for a good cause.'],
    ['NGO', 'en-gee-oh', 'Non-Governmental Organization. A non-profit group independent from the government.'],
    ['Volunteer', 'volunteer', 'A person who freely offers to take part in an enterprise or do a task.'],
    ['Shelter', 'shelter', 'A place providing food, protection, and temporary housing for homeless people.'],
    ['Fundraiser', 'fundraiser', 'An event or campaign held to collect money for a charity.']
  ];
  
  const g = h('div', 'cards');
  V.forEach(v => {
    const f = `<div class="en">${v[0]}</div><button class="say" title="Listen">🔊</button><small style="color:var(--mute); margin-top:10px;">tap to flip</small>`;
    const d = `<div style="font-size: 1.1rem; font-weight: 600;">${v[2]}</div>`;
    const c = flip(f, d);
    c.querySelector('.say').onclick = e => { e.stopPropagation(); say(v[0]); };
    g.appendChild(c);
  });
  b.appendChild(g);
})();

/* ---------------- 3 SAY IT RIGHT ---------------- */
(() => {
  const b = task(3, '🗣️', 'Say It Right', 'Press 🔊, listen, then click the <b>stressed syllable</b>.');
  const P = [
    ['volunteer', '/ˌvɒlənˈtɪə/', ['vol', 'un', 'teer'], 2, 'Stress on the final syllable: vol-un-TEER.'],
    ['charity', '/ˈtʃærəti/', ['char', 'i', 'ty'], 0, 'Stress the first syllable: CHAR-i-ty.'],
    ['donate', '/dəʊˈneɪt/', ['do', 'nate'], 1, 'Stress the second syllable: do-NATE.'],
    ['organization', '/ˌɔːɡənaɪˈzeɪʃən/', ['or', 'gan', 'i', 'za', 'tion'], 3, 'Main stress on ZA.'],
    ['community', '/kəˈmjuːnəti/', ['com', 'mu', 'ni', 'ty'], 1, 'Stress on MU.']
  ];
  
  P.forEach((p, k) => {
    reg(); const r = h('div', 'pron');
    r.innerHTML = `<span class="w">${p[0]}</span><span class="ipa">${p[1]}</span>`;
    const s = h('button', 'say', '🔊'); s.onclick = () => say(p[0]); r.appendChild(s);
    const fb = h('span', 'fb'); let wrong = false, solved = false;
    p[2].forEach((t, i) => {
      const y = h('button', 'syl', t);
      y.onclick = () => {
        if(solved) return;
        if(i === p[3]) { solved = true; y.classList.add('good'); y.textContent = t.toUpperCase(); if(!wrong) ok('p'+k); fb.textContent = p[4]; }
        else { wrong = true; y.classList.add('bad'); }
      };
      r.appendChild(y);
    });
    r.appendChild(fb); b.appendChild(r);
  });
})();

/* ---------------- 4 GRAMMAR 1: BOTH, EITHER, NEITHER ---------------- */
(() => {
  const b = task(4, '⚖️', 'Both, Either, Neither', 'Study the rules, then select the correct word for each gap.');
  
  const gbox = h('div', 'grammar-box');
  gbox.innerHTML = `
    <h3>Both, Either, Neither</h3>
    <p style="margin-bottom: 8px;">We use these words to talk about <b>two</b> things or people.</p>
    <ul style="margin:0; padding-left: 20px; color: var(--mute);">
      <li><b>Both</b> = This one AND that one. <i>(Both of my parents volunteer.)</i></li>
      <li><b>Either</b> = This one OR that one. <i>(You can either donate money or clothes.)</i></li>
      <li><b>Neither</b> = NOT this one and NOT that one. <i>(Neither of the shelters has enough food.)</i></li>
    </ul>
  `;
  b.appendChild(gbox);

  const bank = ['Both', 'either', 'Neither'];
  const G = [
    ['___ of the NGOs are doing incredible work in the city.', 'Both'],
    ['I don\'t have time today. I can volunteer on ___ Saturday or Sunday.', 'either'],
    ['___ of the two homeless men had a warm coat, so we gave them blankets.', 'Neither'],
    ['We can ___ organize a bake sale or a charity run to raise funds.', 'either'],
    ['___ volunteers and full-time staff are needed for this campaign.', 'Both']
  ];
  
  G.forEach((g, i) => {
    reg(); const d = h('div', 'gap'); const parts = g[0].split('___');
    const s = h('select'); s.innerHTML = '<option value="">…</option>' + shuffle(bank).map(w => `<option>${w}</option>`).join('');
    s.onchange = () => { if(!s.value) { s.className = ''; return; } if(s.value.toLowerCase() === g[1].toLowerCase()) { s.className = 'good'; ok('g'+i); } else s.className = 'bad'; };
    d.append(parts[0], s, parts[1]); b.appendChild(d);
  });
})();

/* ---------------- 5 MATCH IT ---------------- */
(() => {
  const b = task(5, '🧩', 'Match It: Complete the Sentences', 'Click the first half of the sentence on the left, then the correct ending on the right.');
  
  const pairs = [
    ['Both my sister and I...', 'volunteer at the local animal shelter.'],
    ['You can either donate money online...', 'or bring cash to the office.'],
    ['Neither of the organizations...', 'has enough funding to build a new center.'],
    ['We will be serving hot meals...', 'to the homeless this time tomorrow.'],
    ['The charity campaign aims...', 'to raise awareness about poverty.']
  ];
  
  reg(pairs.length);
  const w = h('div', 'match'), L = h('div', 'mcol'), R = h('div', 'mcol'); let sl = null, sr = null;
  const mk = (txt, id, side) => {
    const btn = h('button', 'mitem', txt); btn.dataset.id = id;
    btn.onclick = () => {
      if(btn.classList.contains('good')) return;
      if(side === 'L') { if(sl) sl.classList.remove('sel'); sl = btn; } else { if(sr) sr.classList.remove('sel'); sr = btn; }
      btn.classList.add('sel');
      if(sl && sr) {
        const a = sl, c = sr; sl = sr = null;
        if(a.dataset.id === c.dataset.id) { [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); }); ok('m' + a.dataset.id); }
        else { [a, c].forEach(x => x.classList.add('bad')); setTimeout(() => [a, c].forEach(x => x.classList.remove('bad', 'sel')), 600); }
      }
    }; return btn;
  };
  shuffle(pairs.map((p, i) => [p[0], i])).forEach(x => L.appendChild(mk(x[0], x[1], 'L')));
  shuffle(pairs.map((p, i) => [p[1], i])).forEach(x => R.appendChild(mk(x[0], x[1], 'R')));
  w.append(L, R); b.appendChild(w);
})();

/* ---------------- 7 GRAMMAR 2: FUTURE CONTINUOUS ---------------- */
(() => {
  const b = task(7, '⏳', 'Future Continuous', 'Arrange the words to form correct Future Continuous sentences.');
  
  const gbox = h('div', 'grammar-box');
  gbox.style.borderLeftColor = 'var(--coral)';
  gbox.innerHTML = `
    <h3>will be + V(-ing)</h3>
    <p style="margin: 0; color: var(--mute);">We use the Future Continuous to talk about actions that will be <b>in progress</b> at a specific time in the future.</p>
    <p style="margin: 8px 0 0 0;"><i>"At 6 PM tomorrow, I <b>will be packing</b> boxes for the charity."</i></p>
  `;
  b.appendChild(gbox);

  b.appendChild(h('h4', null, 'Order the sentence:'));
  b.lastChild.style.margin = '16px 0 8px';

  // ORDERER LOGIC
  const seq = ['This', 'time', 'next', 'year,', 'we', 'will', 'be', 'opening', 'a', 'new', 'shelter.'];
  reg(1); let cur = shuffle(seq); while(cur.join() === seq.join()) cur = shuffle(seq);
  const list = h('ol', 'order');
  const draw = () => {
    list.innerHTML = '';
    cur.forEach((t, i) => {
      const li = h('li', 'oitem'); li.innerHTML = `<span>${t}</span>`;
      const u = h('button', 'mini', '↑'), d = h('button', 'mini', '↓');
      u.onclick = () => { if(i > 0) { [cur[i-1], cur[i]] = [cur[i], cur[i-1]]; draw(); } };
      d.onclick = () => { if(i < cur.length - 1) { [cur[i+1], cur[i]] = [cur[i], cur[i+1]]; draw(); } };
      li.append(u, d); list.appendChild(li);
    });
  };
  draw();
  const btn = h('button', 'btn', 'Check sentence'), fb = h('span', 'fb'); fb.style.marginLeft = '12px';
  btn.onclick = () => {
    let all = true;
    [...list.children].forEach((li, i) => {
      const g = cur[i] === seq[i];
      li.classList.toggle('good', g); li.classList.toggle('bad', !g);
      if(!g) all = false;
    });
    fb.textContent = all ? ' ✔ Perfect grammar!' : ' Green = right place. Keep moving the red ones.';
    if(all) ok('ord1');
  };
  b.append(list, btn, fb);
})();

/* ---------------- 8 ERROR SPY ---------------- */
(() => {
  const b = task(8, '🔍', 'Error Spy', 'Each sentence hides ONE mistake – about grammar or vocabulary. Click the wrong word, then type the correction.');
  
  const E = [
    ['[Both] of the volunteer [is] working hard at the [fundraiser].', 1, ['are']],
    ['We will [serving] food at the shelter [at] 6 PM [tomorrow].', 0, ['be serving', 'serve']],
    ['I can\'t work on [Monday], and I can\'t work on [Tuesday]. I can\'t work on [both] day.', 2, ['either']],
    ['Please [donator] to our campaign [so] we can buy [blankets].', 0, ['donate']],
    ['[Neither] of the two shelters [have] enough beds for the [winter].', 1, ['has']]
  ];
  
  E.forEach((e, k) => {
    reg(); const d = h('div', 'spyrow'); let idx = 0;
    const html = e[0].replace(/\[(.+?)\]/g, (m, w) => `<span class="spy" data-i="${idx++}">${w}</span>`);
    d.innerHTML = `<div>${html}</div>`; 
    const fix = h('div', 'fix-box'); d.appendChild(fix);
    d.querySelectorAll('.spy').forEach(sp => {
      sp.onclick = () => {
        if(sp.classList.contains('found')) return;
        if(+sp.dataset.i !== e[1]) { sp.classList.add('wrong'); setTimeout(() => sp.classList.remove('wrong'), 600); return; }
        sp.classList.add('wrong');
        fix.innerHTML = ''; 
        const inp = h('input'); inp.type = 'text'; inp.placeholder = 'Type correction...';
        const c = h('button', 'btn', 'Fix');
        c.onclick = () => {
          if(e[2].map(norm).includes(norm(inp.value))) {
            sp.classList.remove('wrong'); sp.classList.add('found'); sp.textContent = e[2][0];
            fix.innerHTML = '<span class="fb">✔ Fixed!</span>'; ok('e'+k);
          } else { inp.className = 'bad'; }
        };
        inp.onkeydown = ev => { if(ev.key === 'Enter') c.click(); };
        fix.append(inp, c); inp.focus();
      };
    });
    b.appendChild(d);
  });
})();

  };

  b.appendChild(h('h3', null, 'Writing log')); b.lastChild.style.margin = '20px 0 8px';
  b.appendChild(h('p', 'instr', 'Write 5–7 sentences answering your prompt. Try to use at least <b>3</b> words from the vocabulary list.'));
  
  const W = ['charity', 'donate', 'ngo', 'volunteer', 'shelter', 'fundraiser', 'homeless', 'awareness', 'both', 'either', 'neither'];
  const ta = h('textarea'); ta.placeholder = 'I think the most important charity campaign would be...';
  
  const wd = h('div', 'words'); wd.innerHTML = W.map(w => `<span>${w}</span>`).join('');
  const cnt = h('div', 'fb'); cnt.style.color = 'var(--mute)'; reg();
  
  const upd2 = () => {

    [...wd.children].forEach((s, i) => { const on = t.includes(W[i]); s.classList.toggle('on', on); if(on) n++; });

    cnt.textContent = `${wc} words · ${n} vocab words used`;
    if(n >= 3 && wc >= 30) ok('write');
  };
  ta.oninput = upd2; b.append(ta, wd, cnt); upd2();
})();
