<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHO Regional Committee - Rapid Vote Counter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Focus Animation */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .active-country {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3) !important;
            transform: scale(1.02);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- APP VIEW -->
    <div id="app-view" class="flex-grow flex flex-col">
        
        <!-- Sticky Header & Controls -->
        <header class="sticky top-0 z-20 bg-white border-b shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 space-y-4">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-blue-900 tracking-tight">WHO Regional Committee</h1>
                        <p class="text-sm text-slate-500 font-medium">Rapid Keyboard Entry Mode</p>
                    </div>
                    <button onclick="showReportView()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg shadow transition-colors flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V8z" clip-rule="evenodd" />
                        </svg>
                        Finish & Generate Report
                    </button>
                </div>

                <!-- Keyboard Shortcuts Legend & Live Totals -->
                <div class="flex flex-col lg:flex-row gap-4 justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                    
                    <div class="flex flex-wrap items-center gap-3 text-sm">
                        <span class="font-semibold text-slate-700 mr-2">Shortcuts (Cmd+Key or Key):</span>
                        <div class="flex items-center gap-1"><kbd class="bg-white border shadow-sm px-2 py-1 rounded text-green-700 font-bold">Y</kbd> = Yes</div>
                        <div class="flex items-center gap-1"><kbd class="bg-white border shadow-sm px-2 py-1 rounded text-red-700 font-bold">H</kbd> = No</div>
                        <div class="flex items-center gap-1"><kbd class="bg-white border shadow-sm px-2 py-1 rounded text-yellow-700 font-bold">A</kbd> = Abstain</div>
                        <div class="flex items-center gap-1"><kbd class="bg-white border shadow-sm px-2 py-1 rounded text-slate-700 font-bold">S</kbd> = Absent</div>
                        <div class="flex items-center gap-1 ml-4"><kbd class="bg-white border shadow-sm px-2 py-1 rounded text-slate-500 text-xs">←</kbd> <kbd class="bg-white border shadow-sm px-2 py-1 rounded text-slate-500 text-xs">→</kbd> = Move</div>
                    </div>

                    <div class="flex flex-wrap gap-2 text-sm font-semibold">
                        <div class="px-3 py-1 bg-white rounded-md border text-slate-600 shadow-sm">Total: <span id="stat-total">53</span></div>
                        <div class="px-3 py-1 bg-green-100 text-green-800 rounded-md border border-green-200 shadow-sm">Yes: <span id="stat-yes">0</span></div>
                        <div class="px-3 py-1 bg-red-100 text-red-800 rounded-md border border-red-200 shadow-sm">No: <span id="stat-no">0</span></div>
                        <div class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-md border border-yellow-200 shadow-sm">Abstain: <span id="stat-abstain">0</span></div>
                        <div class="px-3 py-1 bg-gray-200 text-gray-800 rounded-md border border-gray-300 shadow-sm">Absent: <span id="stat-absent">0</span></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <main class="flex-grow max-w-7xl mx-auto w-full p-4 pb-24">
            <div id="countries-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                <!-- Countries injected via JS -->
            </div>
        </main>
    </div>

    <!-- REPORT VIEW -->
    <div id="report-view" class="hidden flex-grow flex-col bg-white">
        <header class="sticky top-0 z-20 bg-slate-50 border-b shadow-sm">
            <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                <button onclick="hideReportView()" class="text-slate-600 hover:text-blue-600 font-medium flex items-center gap-1 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
                    Back to Voting
                </button>
                <button onclick="exportToWord()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg shadow transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Export to Word (.doc)
                </button>
            </div>
        </header>
        
        <main class="flex-grow max-w-4xl mx-auto w-full p-8">
            <div id="report-content" class="prose max-w-none">
                <!-- Report HTML -->
            </div>
        </main>
    </div>

    <script>
        // 53 Countries of the WHO Regional Committee for Europe
        const initialCountriesData = [
            { name: "Albania", code: "al" }, { name: "Andorra", code: "ad" }, { name: "Armenia", code: "am" },
            { name: "Austria", code: "at" }, { name: "Azerbaijan", code: "az" }, { name: "Belarus", code: "by" },
            { name: "Belgium", code: "be" }, { name: "Bosnia and Herzegovina", code: "ba" }, { name: "Bulgaria", code: "bg" },
            { name: "Croatia", code: "hr" }, { name: "Cyprus", code: "cy" }, { name: "Czech Republic", code: "cz" },
            { name: "Denmark", code: "dk" }, { name: "Estonia", code: "ee" }, { name: "Finland", code: "fi" },
            { name: "France", code: "fr" }, { name: "Georgia", code: "ge" }, { name: "Germany", code: "de" },
            { name: "Greece", code: "gr" }, { name: "Hungary", code: "hu" }, { name: "Iceland", code: "is" },
            { name: "Ireland", code: "ie" }, { name: "Israel", code: "il" }, { name: "Italy", code: "it" },
            { name: "Kazakhstan", code: "kz" }, { name: "Kyrgyzstan", code: "kg" }, { name: "Latvia", code: "lv" },
            { name: "Lithuania", code: "lt" }, { name: "Luxembourg", code: "lu" }, { name: "Malta", code: "mt" },
            { name: "Monaco", code: "mc" }, { name: "Montenegro", code: "me" }, { name: "Netherlands", code: "nl" },
            { name: "North Macedonia", code: "mk" }, { name: "Norway", code: "no" }, { name: "Poland", code: "pl" },
            { name: "Portugal", code: "pt" }, { name: "Republic of Moldova", code: "md" }, { name: "Republic of Uzbekistan", code: "uz" },
            { name: "Romania", code: "ro" }, { name: "Russian Federation", code: "ru" }, { name: "San Marino", code: "sm" },
            { name: "Serbia", code: "rs" }, { name: "Slovakia", code: "sk" }, { name: "Slovenia", code: "si" },
            { name: "Spain", code: "es" }, { name: "Sweden", code: "se" }, { name: "Switzerland", code: "ch" },
            { name: "Tajikistan", code: "tj" }, { name: "Türkiye", code: "tr" }, { name: "Turkmenistan", code: "tm" },
            { name: "Ukraine", code: "ua" }, { name: "United Kingdom", code: "gb" }
        ];

        let state = initialCountriesData.map((c, i) => ({
            ...c, id: i, status: 'none'
        }));
        
        let activeIndex = 0; // The country currently focused for keyboard voting
        let isReportMode = false;

        const statusConfig = {
            'none': { colorClass: 'border-gray-200 bg-white hover:border-gray-300', badge: '' },
            'yes': { colorClass: 'border-green-500 bg-green-50', badge: 'YES', badgeClass: 'bg-green-500' },
            'no': { colorClass: 'border-red-500 bg-red-50', badge: 'NO', badgeClass: 'bg-red-500' },
            'abstain': { colorClass: 'border-yellow-500 bg-yellow-50', badge: 'ABSTAIN', badgeClass: 'bg-yellow-500 text-black' },
            'absent': { colorClass: 'border-slate-400 bg-slate-100 opacity-75', badge: 'ABSENT', badgeClass: 'bg-slate-500' }
        };

        // Render the Grid entirely
        function renderGrid() {
            const grid = document.getElementById('countries-grid');
            grid.innerHTML = '';
            
            state.forEach((country, index) => {
                const config = statusConfig[country.status];
                const isActive = index === activeIndex;
                
                const card = document.createElement('div');
                card.id = `card-${index}`;
                // Apply active class if it's the currently focused country
                card.className = `relative flex flex-col items-center p-4 rounded-xl cursor-pointer transition-all duration-150 border-2 select-none h-full 
                                 ${config.colorClass} ${isActive ? 'active-country' : 'shadow-sm hover:shadow'}`;
                card.onclick = () => setActiveIndex(index);
                
                let badgeHTML = '';
                if (country.status !== 'none') {
                    badgeHTML = `<div class="absolute -top-3 right-2 text-[10px] font-bold px-2 py-0.5 rounded text-white shadow-sm ${config.badgeClass}">${config.badge}</div>`;
                }

                card.innerHTML = `
                    ${badgeHTML}
                    <div class="h-14 w-full flex items-center justify-center mb-3">
                        <img src="https://flagcdn.com/w160/${country.code}.png" 
                             alt="${country.name}" 
                             class="max-h-full max-w-full object-contain rounded-[2px] shadow-sm border border-slate-200"
                             loading="lazy" onerror="this.style.display='none'">
                    </div>
                    <span class="text-center font-medium text-sm leading-tight text-slate-800 flex-grow flex items-center justify-center">
                        ${country.name}
                    </span>
                `;
                grid.appendChild(card);
            });
            
            updateStats();
        }

        // Change focus and scroll into view
        function setActiveIndex(index) {
            if (index < 0 || index >= state.length) return;
            activeIndex = index;
            renderGrid();
            
            // Ensure the active element is visible in the viewport
            const activeElement = document.getElementById(`card-${activeIndex}`);
            if (activeElement) {
                activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Cast a vote for the current active index and auto-advance
        function castVote(voteType) {
            if (activeIndex < 0 || activeIndex >= state.length) return;
            
            state[activeIndex].status = voteType;
            
            // Auto advance to next unvoted or just next
            if (activeIndex < state.length - 1) {
                setActiveIndex(activeIndex + 1);
            } else {
                renderGrid(); // Just re-render if at the end
            }
        }

        function updateStats() {
            const counts = { 'yes': 0, 'no': 0, 'abstain': 0, 'absent': 0 };
            state.forEach(c => {
                if (counts[c.status] !== undefined) counts[c.status]++;
            });
            
            document.getElementById('stat-yes').innerText = counts.yes;
            document.getElementById('stat-no').innerText = counts.no;
            document.getElementById('stat-abstain').innerText = counts.abstain;
            document.getElementById('stat-absent').innerText = counts.absent;
        }

        // --- GLOBAL KEYBOARD LISTENER ---
        document.addEventListener('keydown', (e) => {
            if (isReportMode) return; // Don't trigger if viewing report

            const key = e.key.toLowerCase();
            const hasMeta = e.metaKey || e.ctrlKey;

            // Define target keys
            const isY = key === 'y';
            const isH = key === 'h';
            const isS = key === 's';
            const isA = key === 'a';

            // Navigation
            if (key === 'arrowright' || key === 'arrowdown') {
                e.preventDefault();
                setActiveIndex(activeIndex + 1);
                return;
            }
            if (key === 'arrowleft' || key === 'arrowup') {
                e.preventDefault();
                setActiveIndex(activeIndex - 1);
                return;
            }

            // Voting Logic
            if (isY || isH || isS || isA) {
                // Prevent browser defaults heavily for Cmd+S (Save), Cmd+A (Select All)
                if (hasMeta) e.preventDefault(); 
                
                // OS-level intercepts like Cmd+H (Hide Window on Mac) cannot be fully prevented by JS, 
                // but we preventDefault just in case. This is why bare keys (Y, H, S, A) are also supported.
                if (hasMeta && isH) e.preventDefault();

                if (isY) castVote('yes');
                else if (isH) castVote('no');
                else if (isS) castVote('absent');
                else if (isA) castVote('abstain');
            }
        });

        // --- REPORT LOGIC ---
        function showReportView() {
            isReportMode = true;
            document.getElementById('app-view').classList.add('hidden');
            const reportView = document.getElementById('report-view');
            reportView.classList.remove('hidden');
            reportView.classList.add('flex');
            generateReportHTML();
        }

        function hideReportView() {
            isReportMode = false;
            document.getElementById('report-view').classList.add('hidden');
            document.getElementById('report-view').classList.remove('flex');
            document.getElementById('app-view').classList.remove('hidden');
        }

        function generateReportHTML() {
            const groups = {
                yes: state.filter(c => c.status === 'yes'),
                no: state.filter(c => c.status === 'no'),
                abstain: state.filter(c => c.status === 'abstain'),
                absent: state.filter(c => c.status === 'absent'),
                none: state.filter(c => c.status === 'none')
            };

            const dateStr = new Date().toLocaleString();

            let html = `
                <div style="font-family: Arial, sans-serif; color: #333; line-height: 1.5;">
                    <h1 style="color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 20px;">WHO Regional Committee - Voting Report</h1>
                    <p style="color: #666; font-size: 14px;"><strong>Generated:</strong> ${dateStr}</p>
                    
                    <table style="width: 100%; border-collapse: collapse; margin-top: 30px; margin-bottom: 30px; background-color: #f8fafc;">
                        <tr>
                            <td style="padding: 12px; border: 1px solid #cbd5e1;"><strong style="color: #166534;">Yes (In Favour)</strong></td>
                            <td style="padding: 12px; border: 1px solid #cbd5e1; font-weight: bold;">${groups.yes.length}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #cbd5e1;"><strong style="color: #991b1b;">No (Against)</strong></td>
                            <td style="padding: 12px; border: 1px solid #cbd5e1; font-weight: bold;">${groups.no.length}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #cbd5e1;"><strong style="color: #854d0e;">Abstain</strong></td>
                            <td style="padding: 12px; border: 1px solid #cbd5e1; font-weight: bold;">${groups.abstain.length}</td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border: 1px solid #cbd5e1;"><strong style="color: #475569;">Absent</strong></td>
                            <td style="padding: 12px; border: 1px solid #cbd5e1; font-weight: bold;">${groups.absent.length}</td>
                        </tr>
                    </table>
            `;

            const addSection = (title, list, colorStr) => {
                html += `<h3 style="color: ${colorStr}; margin-top: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px;">${title} (${list.length})</h3>`;
                if (list.length === 0) {
                    html += `<p style="font-style: italic; color: #94a3b8;">None</p>`;
                } else {
                    html += `<ul style="margin-bottom: 20px; padding-left: 20px;">`;
                    list.forEach(c => {
                        html += `<li style="margin-bottom: 4px;">${c.name}</li>`;
                    });
                    html += `</ul>`;
                }
            };

            addSection('Yes (In Favour)', groups.yes, '#166534');
            addSection('No (Against)', groups.no, '#991b1b');
            addSection('Abstain', groups.abstain, '#854d0e');
            addSection('Absent', groups.absent, '#475569');
            
            if (groups.none.length > 0) {
                addSection('Not Recorded', groups.none, '#94a3b8');
            }

            html += `</div>`;
            document.getElementById('report-content').innerHTML = html;
        }

        // Export to Word functionality using Blob
        function exportToWord() {
            const reportContent = document.getElementById('report-content').innerHTML;
            
            // Required Microsoft Word XML namespaces
            const preHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <meta charset='utf-8'>
                <title>Vote Report</title>
            </head><body>`;
            const postHtml = "</body></html>";
            const html = preHtml + reportContent + postHtml;

            const blob = new Blob(['\ufeff', html], {
                type: 'application/msword'
            });
            
            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html);
            const filename = 'WHO_Regional_Committee_Vote_Report.doc';
            
            const downloadLink = document.createElement("a");
            document.body.appendChild(downloadLink);
            
            if(navigator.msSaveOrOpenBlob){
                navigator.msSaveOrOpenBlob(blob, filename);
            } else {
                downloadLink.href = url;
                downloadLink.download = filename;
                downloadLink.click();
            }
            document.body.removeChild(downloadLink);
        }

        // Init
        window.onload = () => {
            renderGrid();
            // Ensure first item is focused visually on load
            setActiveIndex(0);
        };
    </script>
</body>
</html>
